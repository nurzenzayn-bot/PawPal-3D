name: PawPal Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install latest cmdline-tools + SDK Platform 36 (Extension Level 1)
        run: |
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip" -o /tmp/cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36-ext1"
          sdkmanager "build-tools;36.0.0" || echo "build-tools;36.0.0 not available; AGP will auto-download its preferred version"

      - name: Generate .env with all referenced keys
        run: |
          [ -f .env ] || printf 'FIREBASE_APPCHECK_DEBUG_TOKEN=placeholder\n' > .env
          [ -f .env.example ] || cp .env .env.example
          grep -rhoE 'BuildConfig\.[A-Za-z0-9_]+' app/src --include='*.kt' --include='*.java' 2>/dev/null \
            | sed 's/.*BuildConfig\.//' | sort -u > /tmp/keys.txt
          grep -rhoE '\$\{[A-Za-z0-9_]+\}' app/src --include='*.xml' 2>/dev/null \
            | sed 's/${//;s/}//' | sort -u >> /tmp/keys.txt
          sort -u /tmp/keys.txt | while read -r key; do
            [ -n "$key" ] && grep -q "^${key}=" .env || echo "${key}=placeholder" >> .env
          done
          echo "=== generated .env ==="; cat .env

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle (caching + daemon)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawPal-3D-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Run unit tests (Robolectric, non-blocking)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Print test result summary
        if: always()
        run: |
          echo "=== test-results ==="
          find app/build/test-results -name '*.xml' 2>/dev/null | head -20 || true
          echo "=== test reports ==="
          ls -R app/build/reports/tests 2>/dev/null | head -40 || true

      - name: Upload test & build reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawpal-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
