name: PawPal Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-and-build:
    name: Unit tests + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 (Extension Level 1)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36-ext1"


      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ ! -f .env.example ]; then
            printf 'FIREBASE_APPCHECK_DEBUG_TOKEN=placeholder\n' > .env
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle (caching + daemon)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawPal-3D-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test & build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pawpal-failure-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/
          retention-days: 7
